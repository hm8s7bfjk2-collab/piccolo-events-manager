<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16372d"><title>The Piccolo Box | Events Manager</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#183329;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}header{background:#16372d;color:white;padding:20px 18px}header small{letter-spacing:2px;color:#d4c5a4}h1{font-size:24px;margin:6px 0}main{max-width:1000px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#173e31;color:white;font-weight:650;cursor:pointer}nav button{white-space:nowrap;background:#e4e9e3;color:#183329}nav button.active{background:#173e31;color:white}.panel{background:white;border:1px solid #e5e7df;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #00000005}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;background:#fff;border-radius:14px}.stat strong{font-size:25px;display:block}.muted{color:#6b786f;font-size:13px}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item{padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.pill{font-size:12px;border-radius:30px;padding:5px 9px;background:#e4e9e3}.new{background:#dceafa}.quoted{background:#fff0ce}.confirmed{background:#d9f1e3}.cancelled{background:#eee}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5cc;border-radius:9px;background:#fff;font:inherit}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}textarea{min-height:85px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #eee;padding:8px 3px;text-align:left;vertical-align:top}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:68px;background:#f7f8f4;border-radius:8px;padding:6px;font-size:12px;overflow:hidden}.day b{display:block;margin-bottom:4px}.dot{display:block;border-radius:5px;padding:3px;margin:2px 0;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.note{font-size:12px;color:#66766d}a{color:#17634a}.danger{background:#a83b3b}.secondary{background:#e5ebe6;color:#16372d}@media(max-width:550px){.formgrid{grid-template-columns:1fr}.day{min-height:55px;padding:3px}.dot{font-size:8px}.panel{padding:13px}}</style></head><body><header><small>THE PICCOLO BOX</small><h1>Events Manager</h1><div style="color:#d5e4d8;font-size:13px">Small name, big flavour.</div></header><main><nav id="nav"><button>Dashboard</button><button>Enquiries</button><button>Calendar</button><button>Payments</button><button>Settings</button></nav><div id="view"><section class="panel"><h3>Opening Events Manager…</h3><p>If this stays on screen, your file viewer is blocking the app. It needs to run on a website.</p></section></div></main><script>
const KEY='piccolo-events-v1';let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){records=[]}let tab='dashboard',editing=null,month=new Date();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('This preview cannot save bookings permanently. Use the app on a hosted website before entering real customer details.')}render()};const statusClass=s=>s==='New enquiry'?'new':s==='Quote sent'?'quoted':s==='Cancelled'||s==='Declined'?'cancelled':'confirmed';const amount=r=>Math.max(750,Number(r.guests||0)*Number(r.rate||14));const due=r=>Math.max(0,amount(r)-Number(r.paid||0));const daysBefore=(d,n)=>{if(!d)return '';let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};const get=id=>records.find(r=>r.id===id);function setTab(t){tab=t;editing=null;render()}function render(){document.getElementById('nav').innerHTML=['dashboard','enquiries','calendar','payments','settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');document.getElementById('view').innerHTML=tab==='dashboard'?dashboard():tab==='enquiries'?enquiries():tab==='calendar'?calendar():tab==='payments'?payments():settings()}
function dashboard(){let active=records.filter(r=>!['Cancelled','Declined'].includes(r.status));return `<div class="stats"><div class="stat"><span class="muted">Total enquiries</span><strong>${records.length}</strong></div><div class="stat"><span class="muted">Awaiting response</span><strong>${records.filter(r=>r.status==='New enquiry').length}</strong></div><div class="stat"><span class="muted">Confirmed bookings</span><strong>${records.filter(r=>['Confirmed','Deposit paid','Fully paid'].includes(r.status)).length}</strong></div><div class="stat"><span class="muted">Outstanding balances</span><strong>${money(active.reduce((s,r)=>s+due(r),0))}</strong></div></div><section class="panel" style="margin-top:14px"><div class="flex"><h3>Upcoming events</h3><button onclick="newEvent()">+ New enquiry</button></div>${active.filter(r=>r.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).map(item).join('')||'<p class="muted">No upcoming events yet. Add your first enquiry.</p>'}</section><p class="note">Prototype: records are stored only in this browser on this device. Export a backup regularly. This is not yet a secure multi-device booking system.</p>`}
function item(r){return `<div class="item flex"><div><b>${esc(r.name||'Unnamed customer')}</b><div class="muted">${esc(r.date||'Date to confirm')} · ${esc(r.venue||'Venue to confirm')} · ${esc(r.type||'Event')}</div></div><div class="flex"><span class="pill ${statusClass(r.status)}">${esc(r.status)}</span><button class="secondary" onclick="editEvent('${r.id}')">Open</button></div></div>`}
function enquiries(){return `<div class="panel"><div class="flex"><h3>Enquiries & bookings</h3><button onclick="newEvent()">+ New enquiry</button></div>${records.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(item).join('')||'<p class="muted">No enquiries entered yet.</p>'}</div>${editing!==null?form():''}`}
function newEvent(){editing='new';tab='enquiries';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})}function editEvent(id){editing=id;tab='enquiries';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})}
function field(label,name,value='',type='text',extra=''){return `<div><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function form(){let r=editing==='new'?{}:get(editing)||{};return `<section class="panel" id="editor"><div class="flex"><h3>${editing==='new'?'New enquiry':'Edit booking'}</h3><button class="secondary" onclick="editing=null;render()">Close</button></div><form id="eventform" onsubmit="submitEvent(event)"><div class="formgrid">${field('Customer name','name',r.name,'text','required')}${field('Email','email',r.email,'email')}${field('Phone','phone',r.phone,'tel')}${field('Event date','date',r.date,'date')}${field('Venue / location','venue',r.venue)}<div><label>Event type</label><select name="type">${['Wedding','Private party','Corporate event','Other'].map(s=>`<option ${r.type===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('Number of guests','guests',r.guests||'','number','min="0"')}${field('Price per guest (£)','rate',r.rate??14,'number','min="0" step="0.01"')}${field('Service time','time',r.time,'time')}<div><label>Booking status</label><select name="status">${['New enquiry','Quote sent','Accepted','Invoice sent','Confirmed','Deposit paid','Fully paid','Declined','Cancelled'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('Enquiry received','received',r.received||new Date().toISOString().slice(0,10),'date')}${field('Quote sent','quoteDate',r.quoteDate,'date')}${field('Invoice reference','invoice',r.invoice)}${field('Total payments received (£)','paid',r.paid||0,'number','min="0" step="0.01"')}<div class="wide"><label>Menu, dietary needs, access and other notes</label><textarea name="notes">${esc(r.notes||'')}</textarea></div></div><p class="muted">Calculated quote: <b>${money(amount(r))}</b> (minimum £750) · Standard booking fee: £250 · Balance due 14 days before event.</p><div class="flex"><button type="submit">Save booking</button>${editing!=='new'?`<button type="button" class="secondary" onclick="downloadICS('${r.id}')">Add to Apple Calendar</button><button type="button" class="secondary" onclick="copySummary('${r.id}')">Copy quote summary</button><button type="button" class="danger" onclick="deleteEvent('${r.id}')">Delete</button>`:''}</div></form></section>`}
function submitEvent(e){e.preventDefault();const f=new FormData(e.target);let r=editing==='new'?{id:crypto.randomUUID()}:get(editing);for(const [k,v] of f)r[k]=v;if(editing==='new')records.push(r);editing=r.id;save()}function deleteEvent(id){if(confirm('Permanently delete this booking?')){records=records.filter(r=>r.id!==id);editing=null;save()}}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=last;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="day"><b>${d}</b>${records.filter(r=>r.date===date).map(r=>`<span class="dot ${statusClass(r.status)}" onclick="editEvent('${r.id}')">${esc(r.name)}</span>`).join('')}</div>`}return `<div class="panel"><div class="flex"><h3>${month.toLocaleString('en-GB',{month:'long',year:'numeric'})}</h3><div><button class="secondary" onclick="moveMonth(-1)">←</button> <button class="secondary" onclick="moveMonth(1)">→</button></div></div><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="muted" style="text-align:center">${d}</div>`).join('')}${cells}</div><p class="note">Blue: enquiry · Amber: quote sent · Green: accepted/confirmed/paid · Grey: cancelled/declined. Multiple enquiries can appear on the same date.</p></div>`}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function payments(){return `<div class="panel"><h3>Payments</h3><table><tr><th>Customer</th><th>Quote</th><th>Paid</th><th>Balance</th><th>Due</th></tr>${records.filter(r=>!['Declined','Cancelled'].includes(r.status)).map(r=>`<tr><td>${esc(r.name)}</td><td>${money(amount(r))}</td><td>${money(r.paid)}</td><td>${money(due(r))}</td><td>${esc(daysBefore(r.date,14))}</td></tr>`).join('')}</table><p class="note">Payment figures are entered manually. No live payment or invoicing integration yet.</p></div>`}
function settings(){return `<div class="panel"><h3>Settings & backup</h3><p>Minimum event charge: <b>£750</b><br>Standard booking fee: <b>£250</b><br>Balance due: <b>14 days before event</b></p><button onclick="exportData()">Export bookings backup (JSON)</button> <label for="importfile">Import backup</label><input id="importfile" type="file" accept="application/json" onchange="importData(event)"><p class="note">Import replaces current records. Keep backup files somewhere private because they contain customer information.</p></div><div class="panel"><h3>Planned integrations</h3><p class="muted">Secure cloud login, automatic website/email enquiries, branded quote and contract PDFs, customer acceptance, Stripe payment links and two-way booking status/calendar sync are not connected in this prototype.</p></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='piccolo-bookings-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v))throw Error();if(confirm('Replace all current bookings with this backup?')){records=v;save()}}catch{alert('Invalid backup file')}})}function downloadICS(id){let r=get(id);if(!r.date){alert('Enter an event date first');return}let dt=r.date.replaceAll('-','');let body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Piccolo Box//Events Manager//EN','BEGIN:VEVENT','UID:'+r.id+'@piccolobox.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+(()=>{let d=new Date(r.date+'T12:00:00');d.setDate(d.getDate()+1);return d.toISOString().slice(0,10).replaceAll('-','')})(),'SUMMARY:'+`${r.status}: ${r.name} - ${r.type}`.replace(/[,;\\\n]/g,' '),'DESCRIPTION:'+`Guests: ${r.guests||'?'} | ${r.notes||''}`.replace(/[,;\\\n]/g,' '),'LOCATION:'+String(r.venue||'').replace(/[,;\\\n]/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='piccolo-event.ics';a.click();URL.revokeObjectURL(a.href)}function copySummary(id){let r=get(id),txt=`THE PICCOLO BOX - EVENT QUOTATION\nCustomer: ${r.name}\nEvent: ${r.type}\nDate: ${r.date}\nVenue: ${r.venue}\nGuests: ${r.guests}\nQuotation: ${money(amount(r))}\nBooking fee: £250\nBalance due 14 days before event.\n\nThis is a quote summary only; contract terms must be reviewed and attached separately.`;navigator.clipboard?.writeText(txt).then(()=>alert('Quote summary copied')).catch(()=>prompt('Copy quote summary:',txt))||prompt('Copy quote summary:',txt)}render();
</script></body></html>
