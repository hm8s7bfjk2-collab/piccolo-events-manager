<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171311"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Piccolo Events"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><title>The Piccolo Box | Events Manager</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#183329;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}header{background:#16372d;color:white;padding:20px 18px}header small{letter-spacing:2px;color:#d4c5a4}h1{font-size:24px;margin:6px 0}main{max-width:1000px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#173e31;color:white;font-weight:650;cursor:pointer}nav button{white-space:nowrap;background:#e4e9e3;color:#183329}nav button.active{background:#173e31;color:white}.panel{background:white;border:1px solid #e5e7df;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #00000005}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;background:#fff;border-radius:14px}.stat strong{font-size:25px;display:block}.muted{color:#6b786f;font-size:13px}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item{padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.pill{font-size:12px;border-radius:30px;padding:5px 9px;background:#e4e9e3}.new{background:#dceafa}.quoted{background:#fff0ce}.confirmed{background:#d9f1e3}.cancelled{background:#eee}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5cc;border-radius:9px;background:#fff;font:inherit}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}textarea{min-height:85px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #eee;padding:8px 3px;text-align:left;vertical-align:top}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:68px;background:#f7f8f4;border-radius:8px;padding:6px;font-size:12px;overflow:hidden}.day b{display:block;margin-bottom:4px}.dot{display:block;border-radius:5px;padding:3px;margin:2px 0;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.note{font-size:12px;color:#66766d}a{color:#17634a}.danger{background:#a83b3b}.secondary{background:#e5ebe6;color:#16372d}@media(max-width:550px){.formgrid{grid-template-columns:1fr}.day{min-height:55px;padding:3px}.dot{font-size:8px}.panel{padding:13px}}@media print{body>header,body>main{display:none!important}#printQuote{display:block!important;position:static!important;background:white!important}#printQuote .no-print{display:none!important}}#printQuote{display:none}#printQuote .quote-paper{max-width:750px;margin:auto;background:white;color:#183329;padding:24px}#printQuote h2{border-bottom:3px solid #16372d;padding-bottom:12px}#printQuote .quote-row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0;gap:12px}#printQuote .quote-small{font-size:12px;color:#555}#printQuote .quote-total{font-size:23px;font-weight:750}.warning{padding:12px;background:#fff0ce;border-radius:10px;margin:12px 0}

:root{color:#30201b;background:#f7f2e9}body{background:#f7f2e9;color:#30201b}header{background:#171311;color:#f7f2e9;border-bottom:4px solid #e45c3b;padding:24px 18px}header small{color:#e45c3b;font-weight:800;letter-spacing:2.2px}header h1{font-family:Georgia,serif;font-size:30px;font-weight:500}header div{color:#d9cec2!important}button,.btn{background:#e45c3b;color:white;border-radius:7px}nav button{background:#eee4d8;color:#382a24}nav button.active{background:#171311;color:#fff}.panel,.stat{background:#fffdf9;border-color:#e9ded0;box-shadow:0 3px 14px #301b110a}.panel h3{font-family:Georgia,serif;font-weight:500;font-size:22px;color:#30201b}.muted,.note{color:#78675c}.day{background:#f7f2e9}.secondary{background:#efe5d9;color:#30201b}.danger{background:#a63d37}input,select,textarea{border-color:#d7c8b7}.new{background:#dceafa}.quoted{background:#f8e7c5}.confirmed{background:#d9f1e3}.cancelled{background:#eee}a{color:#b94e30}#printQuote .quote-paper{color:#30201b;font-family:Georgia,serif}#printQuote h2{border-bottom-color:#e45c3b;font-size:30px}#printQuote .quote-total{color:#b94e30}.warning{background:#fff1df;color:#52351f}.quote-terms{font-family:Arial,sans-serif;font-size:11px;line-height:1.5;color:#30201b;page-break-before:always;margin-top:32px}.quote-terms h3{font-family:Georgia,serif;color:#30201b;font-size:20px}.quote-terms h4{margin:14px 0 4px;font-size:12px}.quote-terms p{margin:0 0 7px}.quote-brand{background:#171311;color:#f7f2e9;padding:20px;margin:-24px -24px 24px}.quote-brand strong{letter-spacing:2px}.quote-brand em{color:#d8c3a9;font-size:12px} @media print{.quote-terms{page-break-before:always}#printQuote .quote-paper{max-width:none;padding:10mm}.quote-brand{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

</style></head><body><header><small>THE PICCOLO BOX</small><h1>Events Manager</h1><div style="color:#d5e4d8;font-size:13px">Small name, big flavour.</div></header><main><nav id="nav"><button>Dashboard</button><button>Enquiries</button><button>Calendar</button><button>Payments</button><button>Settings</button></nav><div id="view"><section class="panel"><h3>Opening Events Manager…</h3><p>If this stays on screen, your file viewer is blocking the app. It needs to run on a website.</p></section></div></main><div id="printQuote"></div><script>
const KEY='piccolo-events-v1', SETTINGS_KEY='piccolo-events-settings-v4';let bankSettings={accountName:'',sortCode:'',accountNumber:''};try{bankSettings={...bankSettings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){};let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){records=[]}let tab='dashboard',editing=null,month=new Date();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('This preview cannot save bookings permanently. Use the app on a hosted website before entering real customer details.')}render()};const statusClass=s=>s==='New enquiry'?'new':s==='Quote sent'?'quoted':s==='Cancelled'||s==='Declined'?'cancelled':'confirmed';const amount=r=>Math.max(750,Number(r.guests||0)*Number(r.rate||14));const due=r=>Math.max(0,amount(r)-Number(r.paid||0));const daysBefore=(d,n)=>{if(!d)return '';let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};const get=id=>records.find(r=>r.id===id);const paymentRef=r=>'PB-'+String(r.invoice||r.id?.slice(0,8)||'NEW').replace(/[^a-zA-Z0-9-]/g,'').toUpperCase();const bankReady=()=>!!(bankSettings.accountName.trim()&&/^\d{6}$/.test(bankSettings.sortCode.replace(/\D/g,''))&&/^\d{8}$/.test(bankSettings.accountNumber.replace(/\D/g,'')));const today=()=>new Date().toLocaleDateString('en-CA');function setTab(t){tab=t;editing=null;render()}function render(){document.getElementById('nav').innerHTML=['dashboard','enquiries','calendar','payments','settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');document.getElementById('view').innerHTML=tab==='dashboard'?dashboard():tab==='enquiries'?enquiries():tab==='calendar'?calendar():tab==='payments'?payments():settings()}
const followUpDue=r=>r.status==='Quote sent'&&r.quoteDate&&daysBefore(today(),-7)>=r.quoteDate;const conflictList=(date,id)=>date?records.filter(x=>x.date===date&&x.id!==id&&!['Cancelled','Declined'].includes(x.status)):[];
const prepItems=[['numbers','Final guest numbers confirmed'],['diet','Dietary requirements checked'],['access','Venue access and setup agreed'],['timing','Serving time confirmed'],['balance','Final payment checked in Tide']];
function followUp(id){const r=get(id);if(!r)return;const msg=`Hi ${r.name||'there'},\n\nJust checking you received our quotation for ${r.date||'your event'}. Please let me know if you have any questions.\n\nThanks,\nThe Piccolo Box`;if(navigator.share){navigator.share({title:'The Piccolo Box — quotation follow-up',text:msg}).catch(()=>{});}else{prompt('Copy your follow-up message:',msg)}}
function togglePrep(id,key,checked){const r=get(id);if(!r)return;r.prep={...(r.prep||{}),[key]:checked};save()}
function receipt(id){const r=get(id);if(!r)return;if(Number(r.paid||0)<=0){alert('No payment has been recorded yet.');return}const entries=[];if(r.depositPaidDate)entries.push(['Booking fee',Math.min(250,Number(r.paid||0)),r.depositPaidDate]);if(r.balancePaidDate)entries.push(['Final payment',Math.max(0,Number(r.paid||0)-(r.depositPaidDate?250:0)),r.balancePaidDate]);if(!entries.length)entries.push(['Payment recorded',Number(r.paid||0),'Date not recorded']);const box=document.getElementById('printQuote');box.innerHTML=`<div class="quote-paper"><div class="no-print"><button onclick="window.print()">Print / Save receipt as PDF</button> <button class="secondary" onclick="document.getElementById('printQuote').style.display='none'">Close</button></div><div class="quote-brand"><strong>THE PICCOLO BOX</strong><br><em>Small name, big flavour.</em></div><h2>Payment receipt / record</h2><p><strong>Manually recorded — not bank-verified.</strong> Check against Tide before sharing.</p><p>Customer: ${esc(r.name)}<br>Event date: ${esc(r.date||'To confirm')}<br>Reference: ${esc(paymentRef(r))}</p>${entries.map(([name,value,date])=>`<div class="quote-row"><span>${esc(name)} — ${esc(date)}</span><strong>${money(value)}</strong></div>`).join('')}<div class="quote-row"><span>Total received</span><strong>${money(r.paid)}</strong></div><div class="quote-row"><span>Outstanding</span><strong>${money(due(r))}</strong></div><p class="quote-small">This document records payments manually entered in The Piccolo Box Events Manager; it is not a bank-generated receipt or VAT invoice.</p></div>`;box.style.display='block';box.scrollIntoView({behavior:'smooth'})}
function csvExport(){const rows=[['Reference','Customer','Event date','Status','Quoted total GBP','Paid GBP','Outstanding GBP','Booking fee recorded date','Final payment recorded date','Final balance due date']];records.forEach(r=>rows.push([paymentRef(r),r.name||'',r.date||'',r.status||'',amount(r).toFixed(2),Number(r.paid||0).toFixed(2),due(r).toFixed(2),r.depositPaidDate||'',r.balancePaidDate||'',daysBefore(r.date,14)]));const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='piccolo-payments-accountant.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dashboard(){let active=records.filter(r=>!['Cancelled','Declined'].includes(r.status));return `<div class="stats"><div class="stat"><span class="muted">Total enquiries</span><strong>${records.length}</strong></div><div class="stat"><span class="muted">Awaiting response</span><strong>${records.filter(r=>r.status==='New enquiry').length}</strong></div><div class="stat"><span class="muted">Confirmed bookings</span><strong>${records.filter(r=>['Confirmed','Deposit paid','Fully paid'].includes(r.status)).length}</strong></div><div class="stat"><span class="muted">Outstanding balances</span><strong>${money(active.reduce((s,r)=>s+due(r),0))}</strong></div></div><section class="panel" style="margin-top:14px"><div class="flex"><h3>Upcoming events</h3><button onclick="newEvent()">+ New enquiry</button></div>${active.filter(r=>r.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).map(item).join('')||'<p class="muted">No upcoming events yet. Add your first enquiry.</p>'}</section><section class="panel"><h3>Quotes needing a follow-up</h3>${records.filter(followUpDue).map(r=>`<div class="item flex"><div><b>${esc(r.name)}</b><div class="muted">Quote sent ${esc(r.quoteDate)} · ${esc(r.date||'Date to confirm')}</div></div><button onclick="followUp('${r.id}')">Follow Up</button></div>`).join('')||'<p class="muted">No quotations due for follow-up.</p>'}<p class="note">Checks when you open the app; no automatic notifications.</p></section><p class="note">Prototype: records are stored only in this browser on this device. Export a backup regularly. This is not yet a secure multi-device booking system.</p>`}
function item(r){return `<div class="item flex"><div><b>${esc(r.name||'Unnamed customer')}</b><div class="muted">${esc(r.date||'Date to confirm')} · ${esc(r.venue||'Venue to confirm')} · ${esc(r.type||'Event')}</div></div><div class="flex"><span class="pill ${statusClass(r.status)}">${esc(r.status)}</span><button class="secondary" onclick="editEvent('${r.id}')">Open</button></div></div>`}
function enquiries(){return `<div class="panel"><div class="flex"><h3>Enquiries & bookings</h3><button onclick="newEvent()">+ New enquiry</button></div>${records.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(item).join('')||'<p class="muted">No enquiries entered yet.</p>'}</div>${editing!==null?form():''}`}
function newEvent(){editing='new';tab='enquiries';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})}function editEvent(id){editing=id;tab='enquiries';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})}
function field(label,name,value='',type='text',extra=''){return `<div><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function form(){let r=editing==='new'?{}:get(editing)||{};return `<section class="panel" id="editor"><div class="flex"><h3>${editing==='new'?'New enquiry':'Edit booking'}</h3><button class="secondary" onclick="editing=null;render()">Close</button></div><form id="eventform" onsubmit="submitEvent(event)"><div class="formgrid">${field('Customer name','name',r.name,'text','required')}${field('Email','email',r.email,'email')}${field('Phone','phone',r.phone,'tel')}${field('Event date','date',r.date,'date')}${field('Venue / location','venue',r.venue)}<div><label>Event type</label><select name="type">${['Wedding','Private party','Corporate event','Other'].map(s=>`<option ${r.type===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('Number of guests','guests',r.guests||'','number','min="0"')}${field('Price per guest (£)','rate',r.rate??14,'number','min="0" step="0.01"')}${field('Service time','time',r.time,'time')}<div><label>Booking status</label><select name="status">${['New enquiry','Quote sent','Accepted','Invoice sent','Confirmed','Deposit paid','Fully paid','Declined','Cancelled'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('Enquiry received','received',r.received||new Date().toISOString().slice(0,10),'date')}${field('Quote sent','quoteDate',r.quoteDate,'date')}${field('Invoice reference','invoice',r.invoice)}${field('Quote description','quoteDescription',r.quoteDescription||'Neapolitan stone-baked pizza catering')}${field('Total payments received (£)','paid',r.paid||0,'number','min="0" step="0.01"')}${field('Customer accepted terms (date, if recorded)','acceptedDate',r.acceptedDate,'date')}<div class="wide"><label>Menu, dietary needs, access and other notes</label><textarea name="notes">${esc(r.notes||'')}</textarea></div></div>${editing!=='new'?`<div class="payment-box"><h4>Event preparation checklist</h4>${prepItems.map(([key,label])=>`<label style="display:flex;gap:9px;align-items:center;font-size:14px"><input type="checkbox" style="width:auto" ${r.prep?.[key]?'checked':''} onchange="togglePrep('${r.id}','${key}',this.checked)"> ${label}</label>`).join('')}</div><div class="payment-box"><h4>Bank transfer payments</h4><p>Reference: <strong>${esc(paymentRef(r))}</strong></p><p>Booking fee: £250 · Recorded paid: <strong>${money(r.paid)}</strong> · Outstanding: <strong>${money(due(r))}</strong></p><p>Final balance due: <strong>${esc(daysBefore(r.date,14)||'Event date required')}</strong></p><p class="note">Only record a payment after checking it has arrived in Tide. The customer must accept the terms separately.</p><div class="payment-actions"><button type="button" class="secondary" onclick="recordPayment('${r.id}','deposit')" ${Number(r.paid||0)>=250?'disabled':''}>Mark £250 booking fee received</button><button type="button" class="secondary" onclick="recordPayment('${r.id}','balance')" ${due(r)<=0?'disabled':''}>Mark remaining balance received</button></div>${r.depositPaidDate?`<p class="note">Booking fee recorded: ${esc(r.depositPaidDate)}</p>`:''}${r.balancePaidDate?`<p class="note">Final payment recorded: ${esc(r.balancePaidDate)}</p>`:''}</div>`:''}${editing!=='new'&&conflictList(r.date,r.id).length?`<p class="warning">⚠ Another active enquiry or booking is on this date: ${conflictList(r.date,r.id).map(x=>esc(x.name||'Unnamed')).join(', ')}</p>`:''}<p class="muted">Saved quote estimate: <b>${money(amount(r))}</b> (minimum £750) · Standard booking fee: £250 · Balance due 14 days before event.</p><div class="flex"><button type="submit">Save booking</button>${editing!=='new'?`<button type="button" class="secondary" onclick="downloadICS('${r.id}')">Add to Apple Calendar</button><button type="button" class="secondary" onclick="copySummary('${r.id}')">Copy quote summary</button><button type="button" onclick="previewQuote('${r.id}')">Preview / Print quote</button><button type="button" onclick="sendQuote('${r.id}')">Send quote</button><button type="button" class="secondary" onclick="receipt('${r.id}')">Payment receipt</button><button type="button" class="secondary" onclick="followUp('${r.id}')">Follow Up</button><button type="button" class="danger" onclick="deleteEvent('${r.id}')">Delete</button>`:''}</div></form></section>`}
function submitEvent(e){e.preventDefault();const f=new FormData(e.target);let r=editing==='new'?{id:crypto.randomUUID()}:get(editing);const clashes=conflictList(String(f.get('date')||''),r.id);if(clashes.length&&!confirm('Possible double booking on this date: '+clashes.map(x=>(x.name||'Unnamed')+' ('+x.status+')').join(', ')+'. Save anyway?'))return;for(const [k,v] of f)r[k]=v;if(editing==='new')records.push(r);editing=r.id;save()}function recordPayment(id,kind){const r=get(id);if(!r)return;const already=Number(r.paid||0);const addition=kind==='deposit'?Math.max(0,Math.min(250-already,due(r))):due(r);if(addition<=0){alert('Nothing outstanding for this payment.');return}const label=kind==='deposit'?'booking fee':'remaining balance';if(!confirm(`Have you checked Tide and confirmed receipt of ${money(addition)} for ${r.name||'this booking'} (${label})?`))return;r.paid=String(Math.min(amount(r),already+addition));if(kind==='deposit')r.depositPaidDate=today();else r.balancePaidDate=today();if(due(r)===0)r.status='Fully paid';else if(kind==='deposit'&&r.acceptedDate)r.status='Deposit paid';save()}
function saveBankSettings(e){e.preventDefault();const f=new FormData(e.target);const accountName=String(f.get('accountName')||'').trim(),sortCode=String(f.get('sortCode')||'').replace(/\D/g,''),accountNumber=String(f.get('accountNumber')||'').replace(/\D/g,'');if((sortCode||accountNumber||accountName)&&(!accountName||sortCode.length!==6||accountNumber.length!==8)){alert('Please enter an account name, a 6-digit sort code and an 8-digit account number, or leave all three blank.');return}bankSettings={accountName,sortCode,accountNumber};try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(bankSettings));alert('Bank details saved on this browser. They will appear on new quotation previews when all fields are filled in.')}catch(e){alert('Could not save settings in this browser.')}render()}
function deleteEvent(id){if(confirm('Permanently delete this booking?')){records=records.filter(r=>r.id!==id);editing=null;save()}}
function calendar(){const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=last;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="day"><b>${d}</b>${records.filter(r=>r.date===date).map(r=>`<span class="dot ${statusClass(r.status)}" onclick="editEvent('${r.id}')">${esc(r.name)}</span>`).join('')}</div>`}return `<div class="panel"><div class="flex"><h3>${month.toLocaleString('en-GB',{month:'long',year:'numeric'})}</h3><div><button class="secondary" onclick="moveMonth(-1)">←</button> <button class="secondary" onclick="moveMonth(1)">→</button></div></div><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="muted" style="text-align:center">${d}</div>`).join('')}${cells}</div><p class="note">Blue: enquiry · Amber: quote sent · Green: accepted/confirmed/paid · Grey: cancelled/declined. Multiple enquiries can appear on the same date.</p></div>`}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function payments(){return `<div class="panel"><h3>Payments</h3><table><tr><th>Customer</th><th>Quote</th><th>Paid</th><th>Balance</th><th>Due</th></tr>${records.filter(r=>!['Declined','Cancelled'].includes(r.status)).map(r=>`<tr><td><button class="secondary" onclick="editEvent('${r.id}')">${esc(r.name)}</button><div class="muted">${esc(paymentRef(r))}</div></td><td>${money(amount(r))}</td><td>${money(r.paid)}</td><td>${money(due(r))}</td><td class="${daysBefore(r.date,14)&&daysBefore(r.date,14)<today()&&due(r)>0?'overdue':''}">${esc(daysBefore(r.date,14)||'—')}</td></tr>`).join('')}</table><button onclick="csvExport()">Export accountant CSV</button><p class="note">Amounts are entered manually after checking Tide. Dates are reminders only; no automatic notifications are sent.</p></div>`}
function settings(){return `<div class="panel"><h3>Bank transfer settings</h3><p class="muted">Enter your Tide business bank details here. They will be printed on quotations. These settings are stored only in this browser, not synced to other devices. Only use business details you are comfortable sharing with customers.</p><form onsubmit="saveBankSettings(event)">${field('Account name','accountName',bankSettings.accountName)}${field('Sort code','sortCode',bankSettings.sortCode,'text','inputmode="numeric" placeholder="123456"')}${field('Account number','accountNumber',bankSettings.accountNumber,'text','inputmode="numeric" placeholder="12345678"')}<p class="note">${bankReady()?'Bank details complete — they will appear on quotations.':'Bank details incomplete — no payment instructions will appear on quotations.'}</p><button type="submit">Save bank details</button></form></div><div class="panel"><h3>Settings & backup</h3><p>Pizza-by-the-slice rate: <b>£14 per guest</b><br>Minimum event charge: <b>£750</b><br>Standard booking fee: <b>£250</b><br>Balance due: <b>14 days before event</b></p><button onclick="exportData()">Export bookings backup (JSON)</button> <button class="secondary" onclick="csvExport()">Export accountant CSV</button> <label for="importfile">Import backup</label><input id="importfile" type="file" accept="application/json" onchange="importData(event)"><p class="note">Import replaces current bookings. Bank details are stored separately and are not included in the bookings backup. Keep backups private because they contain customer information.</p></div><div class="panel"><h3>Prototype limitations</h3><p class="muted">No secure login, multi-device sync, automatic sending, bank verification, payment integration or electronic signature. Confirm customer acceptance separately and check Tide before recording payments. Avoid storing real customer personal data until secure storage is added.</p></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='piccolo-bookings-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v))throw Error();if(confirm('Replace all current bookings with this backup?')){records=v;save()}}catch{alert('Invalid backup file')}})}function downloadICS(id){let r=get(id);if(!r.date){alert('Enter an event date first');return}let dt=r.date.replaceAll('-','');let body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Piccolo Box//Events Manager//EN','BEGIN:VEVENT','UID:'+r.id+'@piccolobox.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+(()=>{let d=new Date(r.date+'T12:00:00');d.setDate(d.getDate()+1);return d.toISOString().slice(0,10).replaceAll('-','')})(),'SUMMARY:'+`${r.status}: ${r.name} - ${r.type}`.replace(/[,;\\\n]/g,' '),'DESCRIPTION:'+`Guests: ${r.guests||'?'} | ${r.notes||''}`.replace(/[,;\\\n]/g,' '),'LOCATION:'+String(r.venue||'').replace(/[,;\\\n]/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download='piccolo-event.ics';a.click();URL.revokeObjectURL(a.href)}function copySummary(id){let r=get(id),txt=`THE PICCOLO BOX - EVENT QUOTATION\nCustomer: ${r.name}\nEvent: ${r.type}\nDate: ${r.date}\nVenue: ${r.venue}\nGuests: ${r.guests}\nQuotation: ${money(amount(r))}\nBooking fee: £250\nReference: ${paymentRef(r)}\nBalance due 14 days before event.\n\nThis is a quote summary only; contract terms must be reviewed and attached separately.`;navigator.clipboard?.writeText(txt).then(()=>alert('Quote summary copied')).catch(()=>prompt('Copy quote summary:',txt))||prompt('Copy quote summary:',txt)}
function quoteMessage(r){
 const total=amount(r),balance=Math.max(0,total-250);
 const terms=document.querySelector('#printQuote .quote-terms');
 const lines=[`THE PICCOLO BOX — EVENT QUOTATION`,`Small name, big flavour.`,``,`Prepared for: ${r.name||'To confirm'}`,`Event: ${r.type||'To confirm'}`,`Date: ${r.date||'To confirm'}`,`Venue: ${r.venue||'To confirm'}`,`Serving time: ${r.time||'To confirm'}`,`Guests: ${r.guests||'To confirm'}`,``,`Catering: ${r.quoteDescription||'Neapolitan stone-baked pizza catering'}`,`Quoted total: ${money(total)}`,`Booking fee: £250.00 (part of the total)`,`Remaining balance: ${money(balance)}`,`Final balance due: ${daysBefore(r.date,14)||'14 days before the event'}`,`Payment reference: ${paymentRef(r)}`];
 if(bankReady())lines.push(``,`PAYMENT BY BANK TRANSFER`,`Account name: ${bankSettings.accountName}`,`Sort code: ${bankSettings.sortCode.replace(/(..)(..)(..)/,'$1-$2-$3')}`,`Account number: ${bankSettings.accountNumber}`);
 lines.push(``,`Additional notes: ${r.notes||'None'}`,``,`BOOKING TERMS AND CONDITIONS`,`Working draft — subject to legal review before customer use.`,terms?terms.innerText.replace(/Working draft — subject to legal review before customer use\./,'').trim():'See attached quotation for full terms.',``,`Please reply in writing to confirm acceptance of the quotation and booking terms. Your booking is confirmed only after acceptance and receipt of the booking fee.`,``,`The Piccolo Box | thepiccolobox.co.uk`);
 return lines.join('\n');
}
// Self-contained PDF writer: no external scripts or customer data transmitted.
function makeQuotePDF(r){
 previewQuote(r.id);
 const terms=[...document.querySelectorAll('#printQuote .quote-terms h3,#printQuote .quote-terms h4,#printQuote .quote-terms p')].map(e=>({heading:/^H[34]$/.test(e.tagName),text:e.textContent.trim()}));
 const norm=t=>String(t??'').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/\u00a3/g,'£').replace(/[^\x20-\x7e\xa0-\xff]/g,' ');
 const enc=t=>norm(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const pages=[];let ops=[],y=0,page=0;
 const ink='0.19 0.13 0.11',rust='0.78 0.29 0.18';
 function start(){ops=[];page++;y=750;ops.push('0.09 0.07 0.06 rg 0 775 595 67 re f');ops.push('0.90 0.36 0.23 rg 0 769 595 6 re f');ops.push('1 1 1 rg BT /F2 21 Tf 44 802 Td (THE PICCOLO BOX) Tj ET');ops.push('0.90 0.78 0.66 rg BT /F1 10 Tf 45 786 Td (Small name, big flavour.) Tj ET');ops.push(`${ink} rg`)}
 function finish(){ops.push('0.60 0.53 0.47 rg BT /F1 9 Tf 45 27 Td (The Piccolo Box  |  thepiccolobox.co.uk  |  Page '+page+') Tj ET');pages.push(ops.join('\n'))}
 function need(h){if(y-h<55){finish();start()}}
 function text(t,size=11,bold=false,x=45,step=16){need(step);ops.push(`${ink} rg BT /${bold?'F2':'F1'} ${size} Tf ${x} ${y} Td (${enc(t)}) Tj ET`);y-=step}
 function wrap(t,size=11,bold=false,x=45,width=505){const max=Math.floor(width/(size*.53));let words=norm(t).split(/\s+/),line='';for(const w of words){if((line+' '+w).trim().length>max&&line){text(line,size,bold,x,size+5);line=w}else line=(line+' '+w).trim()}if(line)text(line,size,bold,x,size+5)}
 function gap(n=9){y-=n}
 start();gap(15);text('WEDDING & EVENT QUOTATION',20,true,45,33);
 text('Quotation reference: '+paymentRef(r),11,true);gap(8);
 for(const [label,val] of [['Prepared for',r.name],['Event',r.type],['Event date',r.date],['Venue',r.venue],['Serving time',r.time],['Guests',r.guests]])wrap(label+': '+(val||'To confirm'));
 gap(15);text('CATERING',14,true,45,23);wrap(r.quoteDescription||'Neapolitan stone-baked pizza catering');gap(10);
 wrap('Price: '+(r.guests||0)+' guests x '+money(r.rate||14)+' per person (minimum £750)');
 text('QUOTED TOTAL: '+money(amount(r)),17,true,45,30);
 text('Booking fee (part of total): £250.00',11,true);text('Remaining balance: '+money(Math.max(0,amount(r)-250)),11,true);
 wrap('Final balance due: '+(daysBefore(r.date,14)||'14 days before the event'));gap(14);
 text('PAYMENT BY BANK TRANSFER',14,true,45,24);
 wrap('Account name: '+bankSettings.accountName);wrap('Sort code: '+bankSettings.sortCode.replace(/(..)(..)(..)/,'$1-$2-$3'));
 wrap('Account number: '+bankSettings.accountNumber);wrap('Payment reference: '+paymentRef(r));gap(12);
 text('ADDITIONAL NOTES',12,true,45,20);wrap(r.notes||'None recorded');gap(10);
 wrap('Please reply in writing confirming that you accept the quotation and booking terms.',10,true);
 wrap('DRAFT: Please review the quotation and obtain legal review of the booking terms before customer use.',9);finish();start();gap(12);
 text('BOOKING TERMS & CONDITIONS',17,true,45,30);
 for(const t of terms){if(t.heading){gap(8);wrap(t.text,12,true)}else{wrap(t.text,10,false);gap(5)}}
 gap(12);wrap('Customer acceptance must be recorded separately. Payment alone does not establish acceptance.',10,true);finish();
 const objects=[''];const add=s=>(objects.push(s),objects.length-1);
 const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=[];
 for(const content of pages){const stream=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');const pg=add('<< /Type /Page /Parent PARENT 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+stream+' 0 R >>');kids.push(pg)}
 const rootPages=add('<< /Type /Pages /Kids ['+kids.map(i=>i+' 0 R').join(' ')+'] /Count '+kids.length+' >>');
 for(const i of kids)objects[i]=objects[i].replace('PARENT',String(rootPages));
 const catalog=add('<< /Type /Catalog /Pages '+rootPages+' 0 R >>');
 let pdf='%PDF-1.4\n%PDF\n',offsets=[0];for(let i=1;i<objects.length;i++){offsets.push(pdf.length);pdf+=i+' 0 obj\n'+objects[i]+'\nendobj\n'}
 const xref=pdf.length;pdf+='xref\n0 '+objects.length+'\n0000000000 65535 f \n';for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size '+objects.length+' /Root '+catalog+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
 return new Blob([Uint8Array.from(pdf,c=>c.charCodeAt(0)&255)],{type:'application/pdf'});
}
async function sendQuote(id){
 const r=get(id);if(!r)return;
 if(!bankReady()){alert('Please enter your bank details in Settings before sending the quotation.');return}
 if(!confirm('This PDF includes draft booking terms requiring legal review. Have you checked all details and terms before sharing?'))return;
 const file=new File([makeQuotePDF(r)],'Piccolo-Box-Quote-'+paymentRef(r)+'.pdf',{type:'application/pdf'});
 const intro='Hi '+(r.name||'there')+',\n\nPlease find attached your quotation and booking terms for '+(r.date||'your event')+'. Please reply to confirm your acceptance of both.\n\nThanks,\nThe Piccolo Box';
 if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   try{await navigator.share({files:[file],title:'The Piccolo Box quotation',text:intro});return}catch(e){if(e.name==='AbortError')return}
 }
 // Fallback for browsers unable to share file attachments.
 const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 alert('Your PDF has been saved. Attach it to your email manually.');
}

function previewQuote(id){
 const r=get(id);if(!r)return;
 const total=amount(r), balance=Math.max(0,total-250);
 const detail=(label,value)=>`<div class="quote-row"><span>${label}</span><strong>${esc(value||'To confirm')}</strong></div>`;
 const html=`<div class="quote-paper"><div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button onclick="window.print()">Print / Save as PDF</button><button onclick="sendQuote('${r.id}')">Send quote</button><button class="secondary" onclick="document.getElementById('printQuote').style.display='none'">Close preview</button></div>
 <div class="quote-brand"><strong>THE PICCOLO BOX</strong><br><em>Small name, big flavour.</em></div><h2>Wedding & Event Quotation</h2>
 <p>Small name, big flavour. · <strong>DRAFT QUOTATION — SUBJECT TO AGREED TERMS</strong></p>
 ${detail('Prepared for',r.name)}${detail('Event',r.type)}${detail('Date',r.date)}${detail('Venue',r.venue)}${detail('Serving time',r.time)}${detail('Guests',r.guests)}
 <h3>Catering</h3><p>${esc(r.quoteDescription||'Neapolitan stone-baked pizza catering')}</p>
 ${detail('Pricing',`${r.guests||0} guests × ${money(r.rate||14)} per person (minimum £750)`)}${detail('Quoted total',money(total))}<p class="quote-total">Total ${money(total)}</p>
 <p>Minimum event charge: £750 · Booking fee: £250 · Indicative balance after booking fee: ${money(balance)}</p>
 <p>Final balance due 14 days before the event, subject to agreed booking terms.</p>
 <div class="quote-bank"><h3>Payment by bank transfer</h3>${bankReady()?`<p><strong>Account name:</strong> ${esc(bankSettings.accountName)}</p><p><strong>Sort code:</strong> ${esc(bankSettings.sortCode.slice(0,2)+'-'+bankSettings.sortCode.slice(2,4)+'-'+bankSettings.sortCode.slice(4))}</p><p><strong>Account number:</strong> ${esc(bankSettings.accountNumber)}</p><p><strong>Payment reference:</strong> ${esc(paymentRef(r))}</p><p><strong>Booking fee:</strong> £250.00 (deducted from the quoted total)</p><p><strong>Remaining balance after booking fee:</strong> ${money(balance)}</p><p>Use the same bank details and reference for the final balance, due ${esc(daysBefore(r.date,14)||'14 days before the event')}.</p>`:'<p><strong>Bank details not configured.</strong> Add them in Settings before sending this quotation.</p>'}</div>
 <h3>Additional notes</h3><p style="white-space:pre-wrap">${esc(r.notes||'None recorded')}</p>
 <div class="warning"><strong>Draft only:</strong> Please review all quotation details and booking terms before sending to a customer. This quotation does not confirm a booking. Customer acceptance and electronic signing are not enabled in this prototype. Bank transfers must be checked and recorded manually.</div>
  <section class="quote-terms"><h3>The Piccolo Box — Booking Terms &amp; Conditions</h3>
  <p><strong>Working draft — subject to legal review before customer use.</strong></p>
  <h4>1. Booking confirmation</h4><p>All bookings are subject to availability. A £250 booking fee is required to reserve the agreed date and service period. A booking is confirmed only when the quotation and these terms have been accepted and the booking fee has been received.</p>
  <h4>2. Catering prices</h4><p>Pizza-by-the-slice catering is £14 per person, typically providing approximately 4–6 slices per guest, subject to a minimum catering charge of £750. Bespoke quotations and any separately itemised additional charges take precedence where expressly agreed.</p>
  <h4>3. Payment</h4><p>The £250 booking fee is part of, not additional to, the quoted total. The remaining balance is due no later than 14 days before the event. For bookings made within 14 days of the event, full payment may be requested on confirmation.</p>
  <h4>4. Customer cancellations</h4><p>Please notify us in writing as soon as possible. The £250 booking fee will normally be retained to cover reasonable administration, planning, preparation and losses arising from reserving the date. Any sum retained will be limited to reasonable costs and losses, taking account of costs saved and replacement bookings. Any excess will be refunded. Any further cancellation charge will likewise be limited to reasonable losses. This does not affect statutory cancellation rights, where applicable.</p>
  <h4>5. Changes and guest numbers</h4><p>Changes to the date, venue, timings, menu or guest numbers must be requested in writing and are subject to availability. Final guest numbers should be confirmed at least 14 days before the event. Increases may incur additional charges. Reductions may not reduce committed costs; the £750 minimum always applies.</p>
  <h4>6. Venue and access</h4><p>The customer must arrange safe, suitable access and operating space for the mobile catering setup, including permissions and any venue restrictions. Please disclose access limitations in advance.</p>
  <h4>7. Weather and safety</h4><p>We can cater outdoors in many conditions, but severe weather or unsafe conditions may prevent service. We will seek a practical alternative where possible. Any charges or refunds will be assessed fairly under the circumstances and applicable law.</p>
  <h4>8. Allergens and dietary requirements</h4><p>Please tell us about dietary requirements and allergies in advance. We handle common allergens, including gluten and milk, and cannot guarantee an allergen-free preparation environment. We will provide ingredient and allergen information on request.</p>
  <h4>9. Service and substitutions</h4><p>Service will take place during the agreed period. Reasonable menu substitutions may be needed if ingredients become unavailable, with dietary suitability and overall quality maintained. Additional service time is subject to agreement and may cost extra.</p>
  <h4>10. Cancellation by The Piccolo Box</h4><p>If we cannot provide the agreed service, we will notify you promptly and discuss alternatives. If no suitable alternative is agreed, payments for services not provided will be refunded, without affecting statutory rights.</p>
  <h4>11. Events beyond reasonable control</h4><p>For circumstances beyond our reasonable control, we will communicate promptly and take reasonable steps to minimise disruption. Nothing in these terms limits rights that cannot legally be excluded.</p>
  <h4>12. Acceptance</h4><p>These terms should be provided before booking confirmation. Acceptance of the quotation and terms must be recorded separately; payment alone should not be relied upon as the sole evidence of acceptance.</p>
  </section>
 <p class="quote-small">Draft generated by The Piccolo Box Events Manager · thepiccolobox.co.uk. Bank transfers are checked manually; no electronic signature or email delivery is active.</p></div>`;
 const box=document.getElementById('printQuote');box.innerHTML=html;box.style.display='block';box.scrollIntoView({behavior:'smooth'});
}
render();
